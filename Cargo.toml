[package]
name = "filetransfer"
version = "1.2.0"
edition = "2021"
description = "Dateien übertragen … – Dolphin service menu applet and standalone tool: copies files to network shares, USB drives or folders via rsync, FAT32-aware"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36.2"
libc = "0.2"
sha2 = "0.11"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
